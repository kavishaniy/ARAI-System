name: arai-system
services:
  # Backend Service (FastAPI + Python)
  - name: backend
    github:
      branch: main
      repo: kavishaniy/ARAI-System
    source_dir: ./backend
    build_command: pip install -r requirements.txt
    run_command: uvicorn app.main:app --host 0.0.0.0 --port 8080
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xs
    envs:
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        value: ""
      - key: SUPABASE_URL
        scope: RUN_AND_BUILD_TIME
        value: ""
      - key: SUPABASE_KEY
        scope: RUN_AND_BUILD_TIME
        value: ""
      - key: SECRET_KEY
        scope: RUN_AND_BUILD_TIME
        value: ""
      - key: SENDGRID_API_KEY
        scope: RUN_AND_BUILD_TIME
        value: ""
      - key: ALLOWED_ORIGINS
        scope: RUN_AND_BUILD_TIME
        value: "https://arai-system.ondigitalocean.app"
      - key: ENVIRONMENT
        value: production
    health_check:
      http_path: /health
    http_routes:
      - path: /api
        component_name: backend

  # Frontend Service (React + Node.js)
  - name: frontend
    github:
      branch: main
      repo: kavishaniy/ARAI-System
    source_dir: ./frontend
    build_command: npm ci && npm run build
    run_command: npm start
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xs
    envs:
      - key: REACT_APP_API_URL
        value: "https://arai-system.ondigitalocean.app/api"
      - key: REACT_APP_ENVIRONMENT
        value: production
    health_check:
      http_path: /

# Routing configuration
ingress:
  rules:
    - match:
        path:
          prefix: /api
      component:
        name: backend
    - match:
        path:
          prefix: /
      component:
        name: frontend
