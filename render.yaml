services:
  - type: web
    name: arai-backend
    env: python
    region: singapore  # Or your preferred region
    plan: free  # Use "paid" for always-on
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONUNBUFFERED
        value: 1
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      # Add your secrets in Render dashboard instead
      - key: SUPABASE_URL
        fromDatabase:
          name: arai_db
          property: connection_string
